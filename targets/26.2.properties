# Цель сборки: Minecraft 26.2.
# loader_version и fabric_api_version сверены с meta.fabricmc.net и Modrinth.
minecraft_version=26.2
loader_version=0.19.5
fabric_api_version=0.161.0+26.2

# Диапазон версий Minecraft для fabric.mod.json. Тильда означает «эта версия и
# её патчи, но не следующая минорная»: файл для 26.2 не загрузится на 26.3,
# поэтому для каждой версии игры выпускается свой jar.
mc_dep=~26.2