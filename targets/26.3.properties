# Цель сборки: Minecraft 26.3.
# loader_version и fabric_api_version сверены с meta.fabricmc.net и Modrinth.
#
# Fabric API для 26.3 берём 0.162.0, а не новейшую 0.163.0: на 0.162.0 мод
# проверен запуском клиента, и эта сборка указана в требованиях на странице
# мода. Новая API тоже подойдёт — граница задаётся снизу, см. fabric_api_dep.
minecraft_version=26.3
loader_version=0.19.5
fabric_api_version=0.162.0+26.3

# См. пояснение в targets/26.2.properties.
mc_dep=~26.3

# Нижняя граница Fabric API: мод собран против этой версии и вызывает её API,
# поэтому более старая сборка даст NoSuchMethodError в игре вместо понятного
# отказа при запуске. Ставим ровно ту, с которой сверялись.
fabric_api_dep=>=0.162.0