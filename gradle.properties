# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Loom
loom_version=1.18-SNAPSHOT

# Какую версию Minecraft собирать, если ключ -Pmc не указан.
# Свойства каждой цели лежат в targets/<версия>.properties.
default_mc=26.2

# Mod Properties
# mod_version — версия самого мода, общая для всех целей сборки.
# Правило: при каждой сборке прибавляем единицу к последнему числу
# (1.0.1 → 1.0.2 → 1.0.3). Суффикс версии игры подставляется из цели,
# поэтому готовые файлы называются так: 1.0.1+26.2 и 1.0.1+26.3.
mod_version=1.0.2
group=nya2dtyan.makotochat